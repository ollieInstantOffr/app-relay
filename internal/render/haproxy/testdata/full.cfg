global
    master-worker
    maxconn 20000
    log stderr format raw local0
    stats socket /run/relay/haproxy-runtime.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    default-server init-addr libc,none inter 2s rise 2 fall 3

frontend stats
    bind 127.0.0.1:8404
    mode http
    no log
    acl acl_rule_1 src 10.8.0.99
    acl acl_rule_2 src 10.8.0.0/24
    acl acl_rule_3 src 127.0.0.1
    http-request deny if acl_rule_1
    http-request deny if !acl_rule_2 !acl_rule_3
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 10s

frontend http-in
    bind 127.0.0.1:10080
    mode http
    option httplog
    option forwardfor except 127.0.0.0/8
    compression algo gzip
    compression type text/html text/plain text/css application/json application/javascript
    acl r1_host_1 req.hdr(host),host_only -m str -i s3.home.lan
    acl r1_path_beg_2 path_beg /v1
    acl r1_path_reg_3 path_reg '^/api/(a|b) x$'
    acl r2_host_1 req.hdr(host),host_only -m end -i .s3.home.lan
    acl r2_header_2 req.hdr(X-Debug) -m found
    acl r2_src_3 src 10.0.0.0/8 192.168.1.0/24
    acl r2_path_4 path /exact
    acl r2_header_5 req.hdr(X-Env) -m str staging
    use_backend minio if r1_host_1 r1_path_beg_2 !r1_path_reg_3
    use_backend minio if r2_host_1 r2_header_2 r2_src_3 r2_path_4 r2_header_5
    default_backend web-app

frontend tls-passthrough
    bind 0.0.0.0:8443 accept-proxy
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    acl r1_sni_1 req.ssl_sni -m str -i redis.home.lan
    use_backend redis if r1_sni_1
    default_backend postgres-ro

backend web-app
    mode http
    balance roundrobin
    option forwardfor
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host app.home.lan
    http-check expect status 200
    default-server inter 5s rise 2 fall 3
    cookie SRVID insert indirect nocache
    retries 3
    option redispatch
    timeout connect 3s
    timeout server 30s
    timeout queue 10s
    server web-app-1 10.0.0.71:8080 check weight 100 cookie web-app-1 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt
    server web-app-2 10.0.0.72:8080 check weight 100 cookie web-app-2 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt
    server web-3 10.0.0.73:8080 check weight 50 backup cookie web-3 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt disabled

backend postgres-ro
    mode tcp
    balance leastconn
    option pgsql-check user relay
    default-server inter 2s rise 1 fall 2
    stick-table type ip size 200k expire 30m
    stick on src
    option redispatch
    server pg-1 10.0.0.31:5432 check weight 100 send-proxy-v2
    server pg-2 [fd00::32]:5432 weight 100 send-proxy-v2

backend minio
    mode http
    balance source
    option httpchk
    http-check send meth HEAD uri /minio/health/live
    http-check expect rstatus ^2
    default-server inter 2s rise 2 fall 3
    server minio-1 minio.lan:9000 check weight 10

backend redis
    mode tcp
    balance first
    option redis-check
    default-server inter 2s rise 2 fall 3
    server redis-1 10.0.0.50:6379 check weight 1
